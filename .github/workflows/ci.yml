name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cold_build:
        description: Measure cold compilation without restoring project build caches
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.2-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: swift --version
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Cache the locked dependency
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/seed
          key: seed-${{ hashFiles('configs/surface_plugins.lock.json') }}
      - name: Restore the latest portable SwiftPM build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm-linux
          key: portable-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: portable-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 configs/surface_plugins_dependency.py ensure
      - run: python3 configs/check_portable_targets.py
      - run: python3 configs/check_domain_boundaries.py
      - name: Compile portable targets and tests
        id: compile
        run: |
          mkdir -p build/portable-test-runs
          swift build --build-path build/swiftpm-linux --build-tests
      - name: Save compiled portable cache even if later tests fail
        if: always() && steps.compile.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm-linux
          key: portable-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - name: Run and reconcile every portable XCTest once
        run: |
          set -o pipefail
          swift test --build-path build/swiftpm-linux list --skip-build > build/portable-test-runs/inventory.txt
          swift test --build-path build/swiftpm-linux --skip-build 2>&1 | tee build/portable-test-runs/swift-test.log
          python3 configs/verify_portable_tests.py --inventory build/portable-test-runs/inventory.txt --log build/portable-test-runs/swift-test.log
      - name: Preserve portable discovery and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-tests-${{ github.run_id }}
          path: build/portable-test-runs/
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: every tracked file gets its last commit time (below).
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      # SwiftPM rebuilds any input whose mtime changed. Commit times keep a restored build incremental:
      # files untouched since the cached build look unchanged, changed files rebuild.
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/seed
          key: seed-${{ hashFiles('configs/surface_plugins.lock.json') }}
      - name: Restore the latest SwiftPM build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 configs/surface_plugins_dependency.py ensure
      - run: python3 configs/check_domain_boundaries.py
      - name: Compile native targets and tests
        id: compile
        run: swift build --build-path build/swiftpm --build-tests
      - name: Save compiled native cache even if later tests fail
        if: always() && steps.compile.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      # setup_local_project.py also builds SurfacePlugins on its own; the test build compiles it anyway.
      - run: python3 configs/validate_repo_commands.py .
      - run: python3 configs/display_budget_report.py --evidence docs/status-panel-budget-evidence.json --output docs/STATUS_PANEL_BUDGET.md --check
      - run: python3 configs/check_accessibility.py
      - run: python3 -m compileall -q configs
      - name: Run all Python workflows and native suites independently
        run: python3 configs/ci_parallel_checks.py tests
      - run: python3 configs/macos_workflow.py build --distribution ad-hoc
      - run: python3 configs/macos_workflow.py smoke
      - run: python3 tools/mcp_integration.py
      - run: git diff --check
      - name: Preserve test and MCP acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.run_id }}
          path: |
            build/ci-status-panel-demo/
            build/test-runs/
            build/ci-verification/
            build/mcp-integration/*/*.log
            build/mcp-integration/*/*.json
            build/mcp-integration/*/*.jsonl
            build/mcp-integration/*/*.txt
          retention-days: 7
          if-no-files-found: error
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
  delivery:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: every tracked file gets its last commit time (below).
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      # SwiftPM rebuilds any input whose mtime changed. Commit times keep a restored build incremental:
      # files untouched since the cached build look unchanged, changed files rebuild.
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/seed
          key: seed-${{ hashFiles('configs/surface_plugins.lock.json') }}
      - name: Restore the latest SwiftPM build
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || inputs.cold_build != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 configs/surface_plugins_dependency.py ensure
      - name: Compile provider and offline profile products
        id: compile
        run: |
          swift build --build-path build/swiftpm --product BCRProviderService
          swift build --build-path build/swiftpm --product BCRProfileTool
      - name: Save compiled delivery products before acceptance
        if: always() && steps.compile.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm
          key: delivery-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - run: python3 configs/package_provider.py --output build/ci-surface-provider --configuration debug
      - run: python3 build/ci-surface-provider/diagnostics/display_targets.py --directory build/ci-surface-provider --check
      - name: Serial real-clock transport acceptance
        run: python3 configs/ci_parallel_checks.py transports
      - name: Isolated display budget latency and cadence acceptance
        run: python3 configs/verify_display_budget.py --binary build/ci-surface-provider/BCRProviderService --output build/ci-display-budget
      - name: Isolated real-time synthetic status demo acceptance
        run: python3 build/ci-surface-provider/diagnostics/verify_status_panel_demo.py --artifact build/ci-surface-provider --output build/ci-status-panel-demo
      - name: Preserve delivery acceptance and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-checks-${{ github.run_id }}
          path: |
            build/ci-verification/
            build/ci-status-panel-demo/
            build/ci-display-budget/
            build/ci-surface-transport/
            build/ci-surface-client-roles/
            build/ci-surface-hardware-roles/
            build/ci-multiple-displays/
      - name: Report whole-run wall time and enforce 300s budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 configs/ci_job_budget.py --cache-key "$RESTORED_BUILD_KEY"
