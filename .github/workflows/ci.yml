name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python3 configs/surface_plugins_dependency.py ensure
      - run: python3 configs/setup_local_project.py
      - run: python3 -m compileall -q configs
      - run: python3 -m unittest discover -s Tests/BuildWorkflowTests -v
      - run: python3 configs/macos_workflow.py test
      - run: python3 configs/macos_workflow.py build --distribution ad-hoc
      - run: python3 configs/macos_workflow.py smoke
      - run: python3 tools/mcp_integration.py
      - run: python3 configs/package_provider.py --output build/ci-surface-provider --configuration debug
      - run: python3 configs/verify_surface_control_transport.py --artifact build/ci-surface-provider --output build/ci-surface-transport
      - run: git diff --check
      - name: Preserve XCTest worker evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xctest-worker-evidence-${{ github.run_id }}
          path: build/test-runs/
          retention-days: 7
          if-no-files-found: error
