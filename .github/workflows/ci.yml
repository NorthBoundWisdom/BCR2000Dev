name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python3 configs/setup_local_project.py
      - run: python3 -m compileall -q configs
      - run: python3 -m unittest discover -s Tests/BuildWorkflowTests -v
      - run: python3 configs/macos_workflow.py test
      - run: python3 configs/macos_workflow.py build
      - run: python3 configs/macos_workflow.py smoke
      - run: git diff --check
