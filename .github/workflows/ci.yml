name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: every tracked file gets its last commit time (below).
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      # SwiftPM rebuilds any input whose mtime changed. Commit times keep a restored build incremental:
      # files untouched since the cached build look unchanged, changed files rebuild.
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Cache the locked SurfacePlugins checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/seed
          key: seed-${{ hashFiles('configs/surface_plugins.lock.json') }}
      - name: Restore the latest SwiftPM build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 configs/surface_plugins_dependency.py ensure
      # setup_local_project.py also builds SurfacePlugins on its own; the test build compiles it anyway.
      - run: python3 configs/validate_repo_commands.py .
      - run: python3 configs/display_budget_report.py --evidence docs/status-panel-budget-evidence.json --output docs/STATUS_PANEL_BUDGET.md --check
      - run: python3 -m compileall -q configs
      - run: python3 -m unittest discover -s Tests/BuildWorkflowTests -v
      - run: python3 configs/macos_workflow.py test
      - run: python3 configs/macos_workflow.py build --distribution ad-hoc
      - run: python3 configs/macos_workflow.py smoke
      - run: python3 tools/mcp_integration.py
      - run: python3 configs/package_provider.py --output build/ci-surface-provider --configuration debug
      - run: python3 build/ci-surface-provider/diagnostics/display_targets.py --directory build/ci-surface-provider --check
      - run: python3 configs/verify_surface_control_transport.py --artifact build/ci-surface-provider --output build/ci-surface-transport
      - run: python3 configs/verify_surface_clients_transport.py --binary build/ci-surface-provider/BCRProviderService --output build/ci-surface-client-roles
      - run: python3 configs/verify_hardware_surface_transport.py --binary build/ci-surface-provider/BCRProviderService --output build/ci-surface-hardware-roles --scoped-clients
      - run: python3 configs/verify_display_budget.py --binary build/ci-surface-provider/BCRProviderService --output build/ci-display-budget
      - run: git diff --check
      - name: Save the SwiftPM build for the next push
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
      - name: Preserve test and MCP acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.run_id }}
          path: |
            build/test-runs/
            build/mcp-integration/*/*.log
            build/mcp-integration/*/*.json
            build/mcp-integration/*/*.jsonl
            build/mcp-integration/*/*.txt
          retention-days: 7
          if-no-files-found: error
