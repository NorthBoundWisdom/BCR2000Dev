name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build-only version (major.minor.patch); manual runs do not publish'
        required: true
        default: '0.1.0'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      distribution: ${{ steps.version.outputs.distribution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          ARCHIVE_ID: ${{ github.run_number }}
          BCR_RELEASE_DISTRIBUTION: ad-hoc
        run: python3 configs/ci_release.py metadata --distribution ad-hoc
      - name: Require a main commit for a pushed tag
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD origin/main
      - run: python3 configs/surface_plugins_dependency.py ensure
      - run: python3 configs/setup_local_project.py
      - run: python3 -m unittest discover -s Tests/BuildWorkflowTests -v
      - run: python3 configs/macos_workflow.py test
      - run: python3 configs/macos_workflow.py build --distribution ad-hoc
      - run: python3 tools/mcp_integration.py
      - name: Build credential-free ad-hoc packages
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_ID: ${{ steps.version.outputs.build_number }}
        run: python3 configs/macos_workflow.py package --architecture universal --distribution ad-hoc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: build/package/*
          if-no-files-found: error
          compression-level: 0
  package-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            configs
            tools
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-universal
          path: build/package
      - name: Launch final ZIP and installed DMG payloads on a fresh runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          packages = sorted(p for p in Path('build/package').iterdir() if p.suffix in {'.zip', '.dmg'})
          if len(packages) != 2:
              raise SystemExit('Expected both ZIP and DMG')
          for package in packages:
              subprocess.run(['python3', 'configs/macos_workflow.py', 'check-package', '--archive', str(package)], check=True)
          PY
  verify:
    needs: [package, package-smoke]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-universal
          path: build/package
      - name: Verify source commit, architectures, metadata and checksums
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          ARCHIVE_ID: ${{ needs.package.outputs.build_number }}
          BCR_RELEASE_DISTRIBUTION: ad-hoc
        run: python3 configs/ci_release.py verify --distribution ad-hoc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: build/package/*
          if-no-files-found: error
          compression-level: 0
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify]
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: build/package
      - name: Publish the explicitly pushed version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import json
          directory = Path('build/package')
          assets = [str(directory / name) for name in json.loads((directory / 'release-assets.json').read_text())]
          tag = os.environ['RELEASE_TAG']
          subprocess.run(['gh', 'release', 'create', tag, '--verify-tag', '--title', tag,
                          '--notes-file', str(directory / 'release-notes.md'), *assets], check=True)
          PY
