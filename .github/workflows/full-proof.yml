name: Complete kernel proof
on:
  workflow_dispatch:
  schedule:
    - cron: '19 19 * * *'
  push:
    branches: [main]
    paths: &proof-paths
      - '.github/workflows/**'
      - 'Package.swift'
      - 'configs/**'
      - 'Sources/**'
      - 'Tests/**'
  pull_request:
    paths: *proof-paths
permissions:
  contents: read
jobs:
  complete-native-proof:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python3 configs/restore_git_mtimes.py
      - name: Identify the Swift toolchain for the build cache
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - name: Restore locked dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/seed
          key: seed-inputs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('configs/surface_plugins.lock.json', 'configs/control_surface_kit.lock.json') }}
      - name: Restore native compiled inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-macos-26-${{ env.SWIFT_ID }}-${{ hashFiles('configs/surface_plugins.lock.json', 'configs/control_surface_kit.lock.json') }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-macos-26-${{ env.SWIFT_ID }}-${{ hashFiles('configs/surface_plugins.lock.json', 'configs/control_surface_kit.lock.json') }}-
      - run: python3 configs/surface_plugins_dependency.py ensure
      - run: python3 configs/control_surface_kit_dependency.py ensure
      - run: python3 configs/ci_prepare_inputs.py
      - run: swift build --build-path build/swiftpm --build-tests
      - name: Complete native suite and temporary scheduler current/cold comparison
        id: proof
        run: python3 configs/macos_workflow.py test --precompiled-tests
      - name: Retain sufficient proof evidence and hash large traces
        if: always()
        env:
          BCR_COMPLETE_PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: python3 configs/ci_proof_evidence.py
      - name: Preserve complete proof summaries and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/test-runs/
            !build/test-runs/**/*.jsonl
          retention-days: 7
          if-no-files-found: error
